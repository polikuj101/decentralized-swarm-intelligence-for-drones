x-swarm-env: &swarm-env
  SWARM_SIZE: "5"
  SWARM_KEY: ${SWARM_KEY:?задайте SWARM_KEY в .env}
  MISSION_FILE: /opt/swarm/config/mission.json
  SCENE_FILE: /opt/swarm/scene/scene.json
  HUD_URL: http://172.33.0.5:8000/api/ingest
  EW_TOKEN: ${EW_TOKEN:?}
  LLM_URL: http://127.0.0.1:8080
  LLM_TIMEOUT_S: "20"
  S1_ENABLE: ${S1_ENABLE:-1}
  S1_MODE: ${S1_MODE:-hybrid}
  S1_EMBED_DIR: /opt/models/embed
  S1_EMBED_FILE: ${S1_EMBED_FILE:-model_quantized.onnx}
  S1_EMBED_DIM: "128"
  S1_EMBED_THREADS: "1"
  S1_TAU: "0.5"
  S2_MIN_GAP_S: "15"
  S2_PERIOD_S: "20"
  VIO_DEROT: ${VIO_DEROT:--1}            # поправка VIO на поворот борта между кадрами (см. swarm/vio_node.py), 0 — выключить
  VIO_FRAME_LOG: ${VIO_FRAME_LOG:-}      # покадровый журнал VIO для сверки с Gazebo (docs/gz_leak/vio_eval.py), по умолчанию выключен
  MANIFEST_WAIT_S: ${MANIFEST_WAIT_S:-90}   # ожидание приказа после старта, потом все сектора (на показе — больше, см. scripts/run_demo.sh)

services:
  drone-agent-1: { environment: *swarm-env }
  drone-agent-2: { environment: *swarm-env }
  drone-agent-3: { environment: *swarm-env }
  drone-agent-4: { environment: *swarm-env }
  drone-agent-5: { environment: *swarm-env }
