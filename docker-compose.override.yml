x-ew-env: &ew-env
  SWARM_SIZE: "5"
  EW_TOKEN: ${EW_TOKEN:?задайте EW_TOKEN в файле .env}
  MESH_CIDR: 172.31.0.0/24
  C2_CIDR: 172.32.0.0/24
  SIM_CIDR: 172.30.0.0/24

services:
  drone-agent-1: { environment: { <<: *ew-env, SELF_MGMT_IP: 172.33.0.11 } }
  drone-agent-2: { environment: { <<: *ew-env, SELF_MGMT_IP: 172.33.0.12 } }
  drone-agent-3: { environment: { <<: *ew-env, SELF_MGMT_IP: 172.33.0.13 } }
  drone-agent-4: { environment: { <<: *ew-env, SELF_MGMT_IP: 172.33.0.14 } }
  drone-agent-5: { environment: { <<: *ew-env, SELF_MGMT_IP: 172.33.0.15 } }

  simulator-core:
    environment:
      GZ_WORLD: swarm_world
      SWARM_SIZE: "5"
      EW_ADMIN_TOKEN: ${EW_ADMIN_TOKEN:?задайте EW_ADMIN_TOKEN в файле .env}    # gps-jam-bridge принимает смену режима GPS только с этим токеном
      LIBGL_ALWAYS_SOFTWARE: 0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ":0"
      MESA_D3D12_DEFAULT_ADAPTER_NAME: NVIDIA
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/usr/lib/x86_64-linux-gnu
    devices:
      - /dev/dxg:/dev/dxg
      - /dev/dri:/dev/dri
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports: []          # порт 9100 наружу не публикуется, только mgmt-net

  ew-injector:
    environment:
      EW_TOKEN: ${EW_TOKEN:?задайте EW_TOKEN в файле .env}
      EW_ADMIN_TOKEN: ${EW_ADMIN_TOKEN:?задайте EW_ADMIN_TOKEN в файле .env}   # изменяющие методы РЭБ (оператор), бортам не выдаётся
      SCENARIO_DIR: /app/scenarios
    networks:
      ui-net: {}
    ports:
      - "127.0.0.1:8080:8080"     # доступ с хоста только с loopback (для ewctl.sh)
    volumes:
      - ./scenarios:/app/scenarios:ro
