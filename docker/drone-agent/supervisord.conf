[program:xrce-agent]
command=MicroXRCEAgent udp4 -p %(ENV_XRCE_PORT)s
environment=FASTRTPS_DEFAULT_PROFILES_FILE="/opt/dds/fastdds_loopback.xml"
priority=10
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:llama-server]
command=nice -n 10 /usr/local/bin/llama-server -m /opt/models/model.gguf -c 2048 -t 2 -tb 2 -np 1 -b 256 -ub 256 --host 127.0.0.1 --port 8080
priority=15
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gz-sensor-bridge]
command=/usr/local/bin/ros-run.sh python3 /opt/sensors/gz_sensor_bridge.py
priority=25
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

