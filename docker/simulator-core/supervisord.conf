[program:gz-sim]
command=gz sim -s -r --headless-rendering -v 3 /opt/swarm/generated/swarm_world.sdf
priority=10
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:gps-jam-bridge]
command=/bin/bash -c "until gz topic -l | grep -q '^/swarm/1/navsat_raw$'; do sleep 2; done; exec python3 /opt/gps_jam_bridge.py"
priority=20
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
